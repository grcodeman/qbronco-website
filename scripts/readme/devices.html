<!doctype html>
<!-- The picture at the top of the README: the home page on a monitor, with a
     phone standing in front of it. scripts/screenshots.mjs drops the two
     screenshots into #desktop and #phone and photographs .stage. Both device
     frames are plain CSS, so there are no mockup images to license. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }

  .stage {
    position: relative;
    width: 1600px;
    height: 1000px;
    border-radius: 36px;
    overflow: hidden;
    /* the notebook's desk, lit from the top left */
    background:
      radial-gradient(1200px 800px at 18% 8%, #fffaf0 0%, rgba(255, 250, 240, 0) 60%),
      radial-gradient(900px 700px at 92% 100%, #e8d5ad 0%, rgba(232, 213, 173, 0) 70%),
      linear-gradient(160deg, #f6efe0 0%, #ece3cf 100%);
  }
  /* faint ruled lines and a red margin, like the page itself */
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, transparent 63px, rgba(194, 54, 47, 0.16) 63px 65px, transparent 65px),
      repeating-linear-gradient(180deg, transparent 0 39px, rgba(120, 160, 200, 0.16) 39px 40px);
  }

  /* ---------- the monitor ---------- */
  .monitor {
    position: absolute;
    left: 96px;
    top: 72px;
    width: 1160px;
  }
  .monitor .shell {
    position: relative;
    padding: 4px;
    border-radius: 22px;
    background: linear-gradient(180deg, #e6e7ea, #b9bbc0);
    box-shadow:
      0 2px 0 rgba(255, 255, 255, 0.6) inset,
      0 30px 60px -10px rgba(74, 52, 20, 0.35),
      0 12px 24px -8px rgba(74, 52, 20, 0.25);
  }
  .monitor .bezel {
    padding: 18px;
    border-radius: 18px;
    background: #121214;
  }
  .monitor .screen {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 4px;
    object-fit: cover;
    object-position: top;
  }
  .monitor .camera {
    position: absolute;
    top: 11px;
    left: 50%;
    width: 7px;
    height: 7px;
    margin-left: -3.5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3a4152, #0b0c10);
  }
  .monitor .neck {
    width: 170px;
    height: 104px;
    margin: -2px auto 0;
    clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%);
    background: linear-gradient(90deg, #a9abb1, #e3e4e7 30%, #f2f3f5 50%, #d4d6da 70%, #a4a6ac);
  }
  .monitor .foot {
    width: 340px;
    height: 16px;
    margin: 0 auto;
    border-radius: 3px 3px 10px 10px;
    background: linear-gradient(180deg, #eceef0, #b3b5ba);
    box-shadow: 0 14px 22px -6px rgba(74, 52, 20, 0.4);
  }

  /* ---------- the phone ---------- */
  .phone {
    position: absolute;
    left: 1124px;
    top: 196px;
    /* drawn at real size (a 393 x 852 point screen), then shrunk */
    transform: scale(0.8);
    transform-origin: top left;
    width: 433px;
    padding: 4px;
    border-radius: 68px;
    background: linear-gradient(135deg, #d8d9dc 0%, #8e9096 35%, #c8c9cd 60%, #7c7e84 100%);
    box-shadow:
      0 50px 90px -10px rgba(60, 40, 12, 0.45),
      0 18px 36px -10px rgba(60, 40, 12, 0.35);
  }
  .phone .bezel {
    position: relative;
    padding: 16px;
    border-radius: 64px;
    background: #0d0d0f;
  }
  .phone .display {
    position: relative;
    overflow: hidden;
    width: 393px;
    height: 852px;
    border-radius: 50px;
    background: #ece8dc;
  }
  .phone .status {
    position: relative;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 30px 0 52px;
    font: 600 17px/1 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: #111;
  }
  .phone .island {
    position: absolute;
    top: 11px;
    left: 50%;
    width: 124px;
    height: 36px;
    margin-left: -62px;
    border-radius: 18px;
    background: #000;
  }
  .phone .icons { display: flex; align-items: center; gap: 6px; }
  .phone .screen {
    display: block;
    width: 393px;
    height: 798px;
    object-fit: cover;
    object-position: top;
  }
  /* side buttons */
  .phone .btn {
    position: absolute;
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #6f7176, #b9babe);
  }
  .phone .btn.action { left: -4px; top: 150px; height: 34px; }
  .phone .btn.up     { left: -4px; top: 220px; height: 62px; }
  .phone .btn.down   { left: -4px; top: 296px; height: 62px; }
  .phone .btn.power  { right: -4px; top: 250px; height: 100px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="monitor">
      <div class="shell">
        <span class="camera"></span>
        <div class="bezel"><img class="screen" id="desktop" alt=""></div>
      </div>
      <div class="neck"></div>
      <div class="foot"></div>
    </div>

    <div class="phone">
      <span class="btn action"></span><span class="btn up"></span><span class="btn down"></span><span class="btn power"></span>
      <div class="bezel">
        <div class="display">
          <div class="status">
            <span>4:00</span>
            <span class="island"></span>
            <span class="icons">
              <!-- signal -->
              <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#111"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
              <!-- wi-fi -->
              <svg width="16" height="12" viewBox="0 0 16 12"><g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a9.4 9.4 0 0 1 13 0"/><path d="M4.2 7a5.6 5.6 0 0 1 7.6 0"/></g><circle cx="8" cy="10.2" r="1.6" fill="#111"/></svg>
              <!-- battery -->
              <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#111" opacity="0.4"/><rect x="2.5" y="2.5" width="17" height="8" rx="2" fill="#111"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#111" opacity="0.4"/></svg>
            </span>
          </div>
          <img class="screen" id="phone" alt="">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
